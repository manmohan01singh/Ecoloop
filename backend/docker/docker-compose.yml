version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecoloop-db
    environment:
      POSTGRES_USER: ecoloop
      POSTGRES_PASSWORD: ecoloop_dev
      POSTGRES_DB: ecoloop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecoloop-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
